<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 310" role="img" aria-label="AWAREmed Health and Wellness Resource Center">
  <defs>
    <!-- Blue leaf: light at tip, deeper at base/center -->
    <linearGradient id="lg-blue" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%"   stop-color="#8DD8F5"/>
      <stop offset="100%" stop-color="#3AABDA"/>
    </linearGradient>
    <!-- Green leaf: light lime at tip, rich green at base -->
    <linearGradient id="lg-green" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%"   stop-color="#A8E06A"/>
      <stop offset="100%" stop-color="#58B52E"/>
    </linearGradient>
    <!-- Brown leaf: light tan at tip, warm brown at base -->
    <linearGradient id="lg-brown" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%"   stop-color="#D4B882"/>
      <stop offset="100%" stop-color="#8B5E30"/>
    </linearGradient>
  </defs>

  <!--
    Trefoil centered at (240,110).
    Each leaf: lens/almond shape. Tip at top (0,-75), base blending into center (0,22).
    Width ~±32 at midpoint. Stacking: green (back), brown (mid), blue (front).
  -->

  <!-- Green leaf — lower-left (rotate 240°) -->
  <g transform="translate(240,110) rotate(240)">
    <path d="M 0,-75 C 32,-46 34,2 0,22 C -34,2 -32,-46 0,-75 Z"
          fill="url(#lg-green)"/>
  </g>

  <!-- Brown leaf — lower-right (rotate 120°) -->
  <g transform="translate(240,110) rotate(120)">
    <path d="M 0,-75 C 32,-46 34,2 0,22 C -34,2 -32,-46 0,-75 Z"
          fill="url(#lg-brown)"/>
  </g>

  <!-- Blue leaf — top (0°) -->
  <g transform="translate(240,110)">
    <path d="M 0,-75 C 32,-46 34,2 0,22 C -34,2 -32,-46 0,-75 Z"
          fill="url(#lg-blue)"/>
  </g>

  <!-- AWARE in bold dark blue -->
  <text x="30" y="248"
        font-family="'Arial Black','Impact','Helvetica Neue',Arial,sans-serif"
        font-weight="900"
        font-size="82"
        fill="#1A6FAA"
        letter-spacing="-2">AWARE</text>

  <!-- MED in bold green -->
  <text x="328" y="248"
        font-family="'Arial Black','Impact','Helvetica Neue',Arial,sans-serif"
        font-weight="900"
        font-size="82"
        fill="#4EA828"
        letter-spacing="-2">MED</text>

  <!-- Tagline: "Health and Wellness Resource Center" — "and" italic -->
  <text x="240" y="291"
        text-anchor="middle"
        font-family="Georgia,'Times New Roman',serif"
        font-size="20"
        fill="#6B4220"
        letter-spacing="0.5">Health <tspan font-style="italic">and</tspan> Wellness Resource Center</text>
</svg>
