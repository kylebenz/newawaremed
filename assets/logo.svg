<svg width="900" height="550" viewBox="0 0 900 550"
     xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect width="100%" height="100%" fill="white"/>

  <!-- Top Symbol -->
  <g transform="translate(450,120)">

    <!-- Blue Top Leaf -->
    <path d="
      M0,-60
      C-35,-20 -35,30 -10,70
      C5,40 10,0 0,-60 Z"
      fill="#66B9E8"/>

    <path d="
      M0,-60
      C35,-20 35,30 10,70
      C-5,40 -10,0 0,-60 Z"
      fill="#0094E0"/>

    <!-- Left Green Leaves -->
    <g transform="translate(-95,105) rotate(-25)">
      <path d="
        M0,0
        C-45,-5 -75,25 -85,60
        C-40,55 -5,35 0,0 Z"
        fill="#58C12E"/>

      <path d="
        M0,0
        C-20,25 -15,55 15,80
        C40,50 35,15 0,0 Z"
        fill="#B9E28A"/>
    </g>

    <!-- Right Brown Leaves -->
    <g transform="translate(95,105) rotate(25)">
      <path d="
        M0,0
        C45,-5 75,25 85,60
        C40,55 5,35 0,0 Z"
        fill="#B98A5A"/>

      <path d="
        M0,0
        C20,25 15,55 -15,80
        C-40,50 -35,15 0,0 Z"
        fill="#7A3D00"/>
    </g>
  </g>

  <!-- Main Logo Text -->
  <text x="450" y="360"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="110"
        font-weight="700">

    <tspan fill="#0094E0">AWARE</tspan>
    <tspan fill="#58C12E">MED</tspan>

  </text>

  <!-- Tagline -->
  <text x="450" y="445"
        text-anchor="middle"
        font-family="Georgia, Times New Roman, serif"
        font-size="40"
        fill="#6B3A16">

    Health
    <tspan font-style="italic"> and </tspan>
    Wellness Resource Center

  </text>

</svg>
