<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" role="img" aria-label="AWAREmed Health and Wellness Resource Center">
  <defs>
    <!-- Blue petal: light sky-blue at tip → medium blue at base -->
    <linearGradient id="pg-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#8DD4EE"/>
      <stop offset="55%"  stop-color="#5AB8DC"/>
      <stop offset="100%" stop-color="#2E8FC5"/>
    </linearGradient>
    <!-- Green petal: light lime at tip → rich green at base -->
    <linearGradient id="pg-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#AAE070"/>
      <stop offset="55%"  stop-color="#72C248"/>
      <stop offset="100%" stop-color="#48A83A"/>
    </linearGradient>
    <!-- Brown petal: light tan at tip → warm brown at base -->
    <linearGradient id="pg-brown" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#D4BC88"/>
      <stop offset="55%"  stop-color="#BFA068"/>
      <stop offset="100%" stop-color="#9A7040"/>
    </linearGradient>
  </defs>

  <!--
    Trefoil centered at (260,108). Each petal is a leaf shape:
    base at (0,0), tip at (0,-82), width ~56 at widest.
    Rotations: blue=0° (up), brown=120° (lower-right), green=240° (lower-left).
    Stacking order back→front: green, brown, blue.
  -->

  <!-- Green petal — lower-left, back layer -->
  <g transform="translate(260,108) rotate(240)">
    <path d="M 0,-82 C 28,-50 28,4 0,10 C -28,4 -28,-50 0,-82" fill="url(#pg-green)"/>
  </g>

  <!-- Brown petal — lower-right, middle layer -->
  <g transform="translate(260,108) rotate(120)">
    <path d="M 0,-82 C 28,-50 28,4 0,10 C -28,4 -28,-50 0,-82" fill="url(#pg-brown)"/>
  </g>

  <!-- Blue petal — top, front layer -->
  <g transform="translate(260,108)">
    <path d="M 0,-82 C 28,-50 28,4 0,10 C -28,4 -28,-50 0,-82" fill="url(#pg-blue)"/>
  </g>

  <!-- AWARE (bold blue) -->
  <text x="36" y="268"
        font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
        font-weight="900" font-size="86" fill="#2E8FC5" letter-spacing="-1">AWARE</text>

  <!-- MED (bold green) -->
  <text x="344" y="268"
        font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
        font-weight="900" font-size="86" fill="#48A83A" letter-spacing="-1">MED</text>

  <!-- Tagline — "and" in italic, rest in normal -->
  <text x="260" y="316" text-anchor="middle"
        font-family="Georgia,'Times New Roman',serif"
        font-size="21" fill="#7B5030" letter-spacing="0.4">Health <tspan font-style="italic">and</tspan> Wellness Resource Center</text>
</svg>
